spring.application.name=abastecimiento

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/abastecimiento}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# El esquema lo define schema.sql (no Hibernate); data.sql carga los datos
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,classpath:migrations/001-articulo-tipo.sql

# Las vistas HTML viven en src/main/resources/view
spring.thymeleaf.prefix=classpath:/view/
